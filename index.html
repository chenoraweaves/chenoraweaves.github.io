<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chenora Weaves</title>
<meta name="description" content="Chenora Weaves — woven with grace and elegance. Call, WhatsApp, email, or follow us.">
<meta name="theme-color" content="#fbf4e3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
/* VOICE: graceful, calm, botanical — matches the brand card
   IDEA: the business card itself, continued down the page
   PICTURE: the brand card (logo + leaves) at the top
   COLOUR and TYPE: cream paper, sage green ink; Cinzel caps + Jost
   LAYOUT: one column, large tap buttons */
:root{--bg:#fbf4e3;--paper:#fffaf0;--ink:#3f4c33;--sage:#5e7148;--sage-d:#4d5e3a;--line:#d9d6bf;--mute:#76806a}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Jost,system-ui,sans-serif;overflow-x:clip}
.hero{max-width:640px;margin:0 auto}
.hero img{display:block;width:100%;height:auto}
.wrap{max-width:520px;margin:0 auto;padding:4px 18px 44px}
.rule{display:flex;align-items:center;gap:14px;margin:6px 0 18px;color:var(--sage);font:500 13px/1 Jost,sans-serif;letter-spacing:.32em;text-transform:uppercase;justify-content:center}
.rule::before,.rule::after{content:"";flex:1;max-width:90px;height:1px;background:var(--sage);opacity:.7}
.list{display:grid;gap:10px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
a.btn{display:flex;align-items:center;gap:14px;min-height:58px;padding:10px 16px;border-radius:14px;border:1px solid var(--line);background:var(--paper);color:var(--ink);text-decoration:none;font-weight:500;transition:border-color .2s,transform .2s}
a.btn:hover{border-color:var(--sage)}
a.btn:active{transform:scale(.985)}
a.btn:focus-visible{outline:2px solid var(--sage);outline-offset:3px}
a.btn svg{width:22px;height:22px;flex:none;color:var(--sage)}
.btn small{display:block;font-weight:400;font-size:14px;color:var(--mute);overflow-wrap:anywhere}
a.pri{background:var(--sage);border-color:var(--sage);color:#fffaf0}
a.pri svg{color:#fffaf0}
a.pri small{color:#e6ecd9}
a.pri:hover{background:var(--sage-d)}
.foot{text-align:center;color:var(--mute);font-size:14px;margin-top:26px;letter-spacing:.04em}
.foot b{font:500 15px/1 Cinzel,serif;color:var(--sage);letter-spacing:.12em;display:block;margin-bottom:6px}
@media(prefers-reduced-motion:reduce){a.btn{transition:none}}
</style>
</head>
